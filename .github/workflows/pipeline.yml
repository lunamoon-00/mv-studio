# Lambda の Python のコード（pipeline/）の自動テスト。
# DynamoDB は moto（にせのAWS）で動かすので、本物の AWS にはつながない。
name: pipeline

on:
  pull_request:
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # Lambda と同じ版
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
